name: release

# Touching this file needs the `workflow` scope on the pushing token, which
# dsh-github requests at sign-in since 0.4.1.

# Every installation package comes from here: pushing a `v*` tag (or running
# this workflow manually for an existing tag) builds both variants and attaches
# them to that tag's GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.3.0
        required: true
        type: string

permissions:
  contents: write
  # npm provenance: the published tarball is attested as built here.
  id-token: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-latest
    env:
      # Repository secret; without it the npm step warns and skips.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build both installation packages
        run: node scripts/pack.mjs
      - name: Check the two artifacts
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          web="dist/dsh-github-${version}.tgz"
          go="dist/dsh-github-${version}-dsh-go.tgz"
          test -f "$web" && test -f "$go" && test -f dist/SHA256SUMS.txt
          # List first: piping tar into `grep -q` kills tar with SIGPIPE under pipefail.
          tar -tzf "$web" > "$RUNNER_TEMP/web.list"
          tar -tzf "$go" > "$RUNNER_TEMP/go.list"
          if grep -qx 'package/lib/dsh-go.js' "$RUNNER_TEMP/web.list"; then
            echo "web package unexpectedly ships lib/dsh-go.js" >&2
            exit 1
          fi
          grep -qx 'package/lib/dsh-go.js' "$RUNNER_TEMP/go.list"
          tar -xOzf "$web" package/package.json > "$RUNNER_TEMP/web.package.json"
          tar -xOzf "$go" package/package.json > "$RUNNER_TEMP/go.package.json"
          if grep -q '"dshGo"' "$RUNNER_TEMP/web.package.json"; then
            echo "web package unexpectedly declares dshGo" >&2
            exit 1
          fi
          grep -q '"dshGo"' "$RUNNER_TEMP/go.package.json"
          echo "$version ok"
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm; skipping"
            exit 0
          fi
          # A secret pasted with a trailing newline would corrupt the .npmrc line.
          token="$(printf '%s' "$NPM_TOKEN" | tr -d '[:space:]')"
          echo "npm token length: ${#token}, prefix: ${token:0:4}"
          # No npm token is shorter than 36 characters; a shorter secret is almost
          # always the token's *name* pasted instead of its value.
          if [ "${#token}" -lt 36 ]; then
            echo "::warning::NPM_TOKEN is ${#token} characters, not an npm token; skipping the npm publish and keeping the Release"
            exit 0
          fi
          : > "$RUNNER_TEMP/npmrc"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$token" >> "$RUNNER_TEMP/npmrc"
          echo "package: ${name}@${version}"
          echo "npm account: $(npm whoami --userconfig "$RUNNER_TEMP/npmrc" --registry https://registry.npmjs.org || echo '(whoami failed)')"
          if ! npm publish --userconfig "$RUNNER_TEMP/npmrc" --access public --provenance; then
            echo "::error::npm publish failed. A 404 on PUT means the scope in ${name} does not belong to that npm account, or the token may only read."
            exit 1
          fi

      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/dsh-github-*.tgz dist/SHA256SUMS.txt --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
